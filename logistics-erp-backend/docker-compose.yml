version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: logistics-erp-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: logistics-erp-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/logistics_erp
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/usr/src/app/uploads

volumes:
  mongodata:
