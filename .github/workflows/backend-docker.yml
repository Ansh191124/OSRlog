name: Build & Push Backend Docker Image

on:
  push:
    branches:
      - main   

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub using PAT
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # 3. Build image
      - name: Build Docker image
        run: |
          docker build -t osrlogistics/osrbackend:${{ github.sha }} ./logistics-erp-backend/
          docker tag osrlogistics/osrbackend:${{ github.sha }} osrlogistics/osrbackend:latest

      # 4. Push image
      - name: Push Docker image
        run: |
          docker push osrlogistics/osrbackend:${{ github.sha }}
          docker push osrlogistics/osrbackend:latest

      # Render does not automatically restart a service merely because the Docker Hub
      # `latest` tag changes. Configure its Deploy Hook URL as a repository secret so
      # the API serving the Netlify frontend is refreshed after every image build.
      - name: Deploy latest backend image to Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
